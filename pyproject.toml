[project]
name = "fx-gateway-proxy"
version = "0.1.0"
description = "OpenAI-compatible reverse proxy for Vercel AI Gateway FX promotional pool (GLM 5.2 / GLM 5.2 Fast)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Xeron2000" }
]
keywords = [
    "openai",
    "reverse-proxy",
    "vercel-ai-gateway",
    "glm-5.2",
    "llm",
    "ai-gateway",
    "prompt-caching",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.scripts]
fx-gateway-proxy = "fx_gateway_proxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
