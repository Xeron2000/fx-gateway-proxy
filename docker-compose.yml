services:
  fx-gateway-proxy:
    image: ghcr.io/xeron2000/fx-gateway-proxy:latest
    build: .
    container_name: fx-gateway-proxy
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      - HOST=0.0.0.0
      - PORT=18080
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY:-}
      - AI_GATEWAY_API_KEYS=${AI_GATEWAY_API_KEYS:-}
    volumes:
      - ~/.fx:/root/.fx:ro
