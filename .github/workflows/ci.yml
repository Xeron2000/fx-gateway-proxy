name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv pip install --system -e .

      - name: Test imports and basic health
        run: |
          python -c "import fx_gateway_proxy; print('Package import OK')"
          python -c "from fx_gateway_proxy.server import app; print('FastAPI app OK')"
